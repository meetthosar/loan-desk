# One command runs everything: docker compose up --build
# The API is on http://localhost:8000 (dashboard at /admin). Model calls need
# OPENROUTER_API_KEY in .env; everything else works without it.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: loandesk
      POSTGRES_PASSWORD: loandesk
      POSTGRES_DB: loandesk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loandesk"]
      interval: 2s
      retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  chroma:
    image: chromadb/chroma:latest
    ports: ["8001:8000"]
    volumes: [chroma:/data]

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      LOANDESK_DATABASE_URL: postgresql+psycopg://loandesk:loandesk@postgres:5432/loandesk
      LOANDESK_QDRANT_URL: http://qdrant:6333
      LOANDESK_CHROMA_URL: chroma:8000
      LOANDESK_STATE_DIR: /app/.loandesk
      LOANDESK_ADMIN_DEV_OPEN: "true"  # dev only; set LOANDESK_ADMIN_JWKS_URL for real logins
    ports: ["8000:8000"]
    volumes: [state:/app/.loandesk]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
      chroma: {condition: service_started}

volumes:
  pgdata:
  qdrant:
  chroma:
  state:
