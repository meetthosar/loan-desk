# 20 seed cases, written from the blueprint before the agent existed (plan: 11 Nov).
# Phones are the scenario borrowers from `loandesk db seed`; +919999999999 is unregistered.
# Format: src/loandesk/evals/cases.py

# --- EMI due date ---
- id: emi-001
  phone: "+919000000001"
  turns: ["When is my next EMI due?"]
  expect: {intent: emi_due_date, tools: [get_loan_account], handoff: false}
  tags: [en]
- id: emi-002
  phone: "+919000000009"
  turns: ["मेरी अगली किस्त कब है और कितनी है?"]
  expect: {intent: emi_due_date, tools: [get_loan_account], handoff: false}
  tags: [hi]
- id: emi-003
  phone: "+919000000004"
  turns: ["How much is my EMI and when do I pay it?"]
  expect: {intent: emi_due_date, tools: [get_loan_account], handoff: false}
  tags: [en, two-loans]

