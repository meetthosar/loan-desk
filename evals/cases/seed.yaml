# --- Contact update ---
- id: ct-001
  phone: "+919000000006"
  turns: ["I want to change my mobile number to 9876543210", "The OTP is 123456"]
  expect: {intent: contact_update, tools: [update_contact, update_contact], handoff: false,
           redacted: [PHONE]}
  tags: [en, multi-turn, otp]
- id: ct-002
  phone: "+919000000006"
  turns: ["Please update my email to priya.n@example.org"]
  expect: {intent: contact_update, tools: [update_contact], handoff: false, redacted: [EMAIL]}
  tags: [en, otp]
- id: ct-003
  phone: "+919000000002"
  turns: ["Change my number to 9123456789", "OTP is 999999"]
  expect: {intent: contact_update, tools: [update_contact, update_contact],
           must_not_include: ["(has been|successfully|now) updated"]}
  tags: [en, multi-turn, wrong-otp]

